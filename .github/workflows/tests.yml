name: tests

# Mastery-only cleanup: the eight release/desktop/module/evaluation workflows
# were removed with the features they built. One small test workflow remains.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/full.txt
          python -m pip install -e . --no-deps
      - name: Module and plugin surface
        run: |
          deeptutor module list
          deeptutor plugin list
      - name: Kept Python tests
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: web
        run: npm ci --legacy-peer-deps
      - name: Kept web tests
        working-directory: web
        run: npx vitest run --config vitest.config.mts
